# FPOLink TN Configuration
# Narrow focus: Erode district, key crops

project:
  name: FPOLink TN
  version: 0.1.0
  description: FPO Digital Operating System for Tamil Nadu

geography:
  state: Tamil Nadu
  districts:
    - name: Erode
      latitude: 11.3410
      longitude: 77.7172
      markets:
        - Erode
        - Gobichettipalayam
        - Bhavani

crops:
  - name: turmeric
    tamil_name: மஞ்சள்
    unit: kg
    category: spice
  - name: banana
    tamil_name: வாழைப்பழம்
    unit: kg
    category: fruit
  - name: coconut
    tamil_name: தேங்காய்
    unit: unit
    category: plantation

data_sources:
  tn_agri:
    enabled: true
    base_url: https://agrimark.tn.gov.in
  agmarknet:
    enabled: true
    base_url: https://agmarknet.gov.in
  open_meteo:
    enabled: true
    base_url: https://api.open-meteo.com/v1

scheduler:
  price_ingestion_cron: "0 6 * * *"  # Daily at 6 AM IST
  weather_ingestion_cron: "0 5 * * *"  # Daily at 5 AM IST
  prediction_cron: "0 7 * * *"  # Daily at 7 AM IST
