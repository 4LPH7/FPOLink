name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpolink
          POSTGRES_PASSWORD: fpolink
          POSTGRES_DB: fpolink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpolink -d fpolink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://fpolink:fpolink@localhost:5432/fpolink_test
          SECRET_KEY: test-secret-key-not-for-production
        run: pytest -v --tb=short

      - name: Run linting
        working-directory: backend
        run: python -m py_compile app/main.py
