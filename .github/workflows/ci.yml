name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpolink
          POSTGRES_PASSWORD: fpolink
          POSTGRES_DB: fpolink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpolink -d fpolink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrations match models
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://fpolink:fpolink@localhost:5432/fpolink_test
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://fpolink:fpolink@localhost:5432/fpolink_test
          SECRET_KEY: test-secret-key-not-for-production
        run: pytest -v --tb=short

      - name: Run linting & format check
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: cp .env.example .env

      - name: Start backend stack
        run: docker compose up -d --build postgres backend worker

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health | grep -q '"status":"ok"'; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Waiting for API to be healthy... ($i/30)"
            sleep 2
          done
          echo "API failed to become healthy in time"
          docker compose logs
          exit 1
